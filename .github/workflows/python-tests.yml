name: Python CI - UAV Routing Tests

on:
  push:
    branches: [ main, develop, nguyen-phuc-ha ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Master Test Suite (14/14 Suites)
        run: |
          python tests/run_all_tests.py

      - name: Verify CLI Entrypoint & Parallel Mode
        run: |
          python src/main.py --benchmark 10 --no-plot --parallel --speedup
